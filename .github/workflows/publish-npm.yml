name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: 'Dry run (test without publishing)'
        required: false
        default: false
        type: boolean

# Prevent concurrent publish attempts
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  # Validate before publish
  validate:
    name: Validate Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: |
          echo "📦 Package contents:"
          npm pack --dry-run
          echo ""
          echo "📁 Dist folder structure:"
          ls -la dist/

  # Publish to npm
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Bump version (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'false'
        run: |
          npm version ${{ github.event.inputs.version }} -m "chore(release): v%s"
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Get version (if release)
        if: github.event_name == 'release'
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Dry run (test publish)
        if: github.event.inputs.dry-run == 'true'
        run: |
          echo "🧪 Dry run mode - simulating publish..."
          npm pack
          echo "📦 Would publish version: $(node -p "require('./package.json').version")"
          npm publish --dry-run --access public

      - name: Publish to npm
        if: github.event.inputs.dry-run != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'false'
        run: git push --follow-tags

      - name: Create GitHub Release (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## 📦 Published to npm
            
            Install: `npm install @mgomez-ext/mrs-ui@${{ env.VERSION }}`
            
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false

  # Notify on success
  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: publish
    if: success() && github.event.inputs.dry-run != 'true'
    steps:
      - name: Log success
        run: |
          echo "✅ Successfully published @mgomez-ext/mrs-ui"
          echo "📦 npm: https://github.com/${{ github.repository }}/packages"
